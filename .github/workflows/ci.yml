name: CI — eDB

on:
  push:
    branches: [master, main, develop]
    tags: ["v*"]
  pull_request:
    branches: [master, main]

jobs:
  # ── Test Matrix ───────────────────────────────────────────────────────────
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    # Every step here is written in bash (backslashes, $(...)). Without this
    # the Windows legs run them under PowerShell, where the multi-line
    # pytest invocation below is a parse error and the job goes red.
    defaults:
      run:
        shell: bash
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
        os: [ubuntu-22.04, macos-latest, windows-2022]
      fail-fast: false

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" pytest-benchmark

      - name: Lint (ruff)
        # No --select/--ignore here: a command-line --select *replaces* the
        # project's rule list, so pyproject.toml's [tool.ruff.lint] select
        # (E,F,W,I,N,UP,B,SIM,RUF) was being narrowed to E,F,W and six rule
        # groups could not fail CI. pyproject.toml already ignores E501.
        run: ruff check .

      - name: Type check (mypy)
        run: mypy . --ignore-missing-imports --no-strict-optional

      - name: Run unit tests
        run: |
          python -m pytest tests/unit/ -v --tb=short \
            --cov=. --cov-report=xml --cov-report=term-missing

      - name: Run functional tests
        run: python -m pytest tests/functional/ -v --tb=short
        continue-on-error: false

      - name: Run performance benchmarks
        run: python -m pytest tests/performance/ -v --tb=short --benchmark-json=benchmark.json
        continue-on-error: true

      - name: Upload coverage
        uses: codecov/codecov-action@v7
        with:
          files: coverage.xml
          flags: edb-py${{ matrix.python-version }}

  # ── Integration Tests (PR CI) ─────────────────────────────────────────────
  # tests/integration/ previously ran only in the scheduled nightly/weekly
  # full runs, so a PR could merge with a failing integration test (#143).
  # This job mirrors the nightly matrix (ubuntu, Python 3.11/3.12) and runs
  # the integration suite on every push and pull request. It is a separate
  # job so the unit-job coverage gate is unaffected.
  integration:
    name: Integration (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
      fail-fast: false
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run integration tests
        run: python -m pytest tests/integration/ -v --tb=short

  # ── Build Python Package ──────────────────────────────────────────────────
  build:
    name: Build Python Package
    runs-on: ubuntu-22.04
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Build wheel
        run: |
          pip install build
          python -m build
      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: edb-wheel
          path: dist/*.whl
          retention-days: 90

  # ── Release ───────────────────────────────────────────────────────────────
  release:
    name: Create GitHub Release
    runs-on: ubuntu-22.04
    needs: [test, build]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Build release package
        run: |
          pip install build
          python -m build
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

